<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" width="1800" height="1120" style="font-family: 'Segoe UI', Arial, Helvetica, sans-serif; background: #ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#18181b" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Crisp White Background -->
  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff" />

  <!-- Outer Frame -->
  <rect x="28" y="24" width="1744" height="1072" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5" />

  <!-- Title Block -->
  <text x="900" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="#18181b" letter-spacing="0.3">
    Data Flow Diagram (Level 0 — Context Diagram)
  </text>
  <text x="900" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#52525b">
    Cof/Tea Cafe Inventory Management with POS System (Updated Architecture)
  </text>
  <line x1="80" y1="116" x2="1720" y2="116" stroke="#e4e4e7" stroke-width="1.2" />

  <!-- ========================================================= -->
  <!-- CENTRAL PROCESS (0)                                       -->
  <!-- ========================================================= -->
  <circle cx="900" cy="580" r="170" fill="#fafafa" stroke="#18181b" stroke-width="2.8" />
  <path d="M 762 480 L 1038 480" stroke="#18181b" stroke-width="1.6" />
  <text x="900" y="458" text-anchor="middle" font-size="18" font-weight="800" fill="#18181b">0</text>
  <text x="900" y="538" text-anchor="middle" font-size="21" font-weight="800" fill="#18181b">
    <tspan x="900" dy="0">Cof/Tea Cafe</tspan>
    <tspan x="900" dy="28">Inventory Management</tspan>
    <tspan x="900" dy="28">with POS System</tspan>
  </text>
  <text x="900" y="644" text-anchor="middle" font-size="12.5" font-weight="500" fill="#52525b">
    <tspan x="900" dy="0">POS • Inventory • Purchasing • CMS</tspan>
    <tspan x="900" dy="18">AI Forecasting • RBAC • Audit &amp; Reports</tspan>
  </text>

  <!-- ========================================================= -->
  <!-- EXTERNAL ENTITIES (5)                                     -->
  <!-- ========================================================= -->

  <!-- 1. Customer (Top-Left) -->
  <rect x="110" y="146" width="230" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="2.4" />
  <text x="225" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">Customer</text>

  <!-- 2. Staff / Cashier (Top-Center) -->
  <rect x="775" y="146" width="250" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="2.4" />
  <text x="900" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">Staff / Cashier</text>

  <!-- 3. Supplier (Right-Upper) - NEW -->
  <rect x="1450" y="425" width="240" height="78" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="2.4" />
  <text x="1570" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">Supplier</text>
  <text x="1570" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">(Supplier Portal)</text>

  <!-- 4. Google Gemini AI (Right-Lower) - NEW -->
  <rect x="1450" y="655" width="240" height="78" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="2.4" />
  <text x="1570" y="692" text-anchor="middle" font-size="19" font-weight="700" fill="#18181b">Google Gemini AI</text>
  <text x="1570" y="714" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">(External Forecast API)</text>

  <!-- 5. Admin / Owner (Bottom) - UPDATED -->
  <rect x="765" y="968" width="270" height="78" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="2.4" />
  <text x="900" y="1006" text-anchor="middle" font-size="20" font-weight="700" fill="#18181b">Admin / Owner</text>
  <text x="900" y="1028" text-anchor="middle" font-size="12" font-weight="500" fill="#52525b">(+ Custom Role Accounts)</text>

  <!-- ========================================================= -->
  <!-- DATA FLOWS                                                -->
  <!-- ========================================================= -->

  <!-- A. Customer <-> Staff / Cashier (Counter POS Exchange) -->
  <line x1="775" y1="166" x2="344" y2="166" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="558" y="155" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">
    Printed / Digital Receipt &amp; Change
  </text>

  <line x1="340" y1="200" x2="771" y2="200" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="558" y="220" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">
    Order Details, Payment (Cash / GCash) &amp; Discount ID
  </text>

  <!-- B. Customer <-> System (Public Menu Board / CMS) - NEW -->
  <!-- Inner channel: System -> Customer -->
  <polyline points="734,540 275,540 275,224" fill="none" stroke="#2563eb" stroke-width="1.9" marker-end="url(#arrowAccent)" />
  <text x="505" y="492" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">
    <tspan x="505" dy="0">Live Public Menu Board, Cup Sizes &amp; Prices</tspan>
    <tspan x="505" dy="18">Promotions, Store Location &amp; Social Links</tspan>
  </text>

  <!-- Outer channel: Customer -> System -->
  <polyline points="175,220 175,620 731,620" fill="none" stroke="#2563eb" stroke-width="1.9" marker-end="url(#arrowAccent)" />
  <text x="465" y="644" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">
    Menu Browsing &amp; Category Filter Requests
  </text>

  <!-- C. Staff / Cashier <-> System -->
  <!-- Left vertical: Staff -> System -->
  <line x1="842" y1="220" x2="842" y2="416" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="826" y="274" text-anchor="end" font-size="13.5" font-weight="600" fill="#18181b">
    <tspan x="826" dy="0">Login Credentials</tspan>
    <tspan x="826" dy="19">POS Orders &amp; Ongoing Holds</tspan>
    <tspan x="826" dy="19">Discounts &amp; Cash / GCash Info</tspan>
    <tspan x="826" dy="19">Wastage Reports (Qty &amp; Reason)</tspan>
    <tspan x="826" dy="19">Product / Stock Requests</tspan>
  </text>

  <!-- Right vertical: System -> Staff -->
  <line x1="958" y1="420" x2="958" y2="224" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="974" y="274" text-anchor="start" font-size="13.5" font-weight="600" fill="#18181b">
    <tspan x="974" dy="0">POS Console &amp; Transaction Results</tspan>
    <tspan x="974" dy="19">Digital Receipt &amp; Change Calculation</tspan>
    <tspan x="974" dy="19">Auto-Deducted Stock Status</tspan>
    <tspan x="974" dy="19">Real-Time Low / Out-of-Stock Alerts</tspan>
  </text>

  <!-- D. Supplier <-> System (NEW) -->
  <!-- Top horizontal: System -> Supplier -->
  <line x1="1010" y1="448" x2="1446" y2="448" stroke="#2563eb" stroke-width="1.9" marker-end="url(#arrowAccent)" />
  <text x="1235" y="422" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">
    <tspan x="1235" dy="0">Purchase Orders (PO) &amp; Delivery Dates</tspan>
    <tspan x="1235" dy="17">Real-Time PO Notifications</tspan>
  </text>

  <!-- Bottom horizontal: Supplier -> System -->
  <line x1="1450" y1="486" x2="1047" y2="486" stroke="#2563eb" stroke-width="1.9" marker-end="url(#arrowAccent)" />
  <text x="1248" y="508" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">
    <tspan x="1248" dy="0">Login Credentials, PO Confirm / Postpone / Decline</tspan>
    <tspan x="1248" dy="17">Price &amp; Qty Proposals • Catalog Price Updates</tspan>
  </text>

  <!-- E. Google Gemini AI <-> System (NEW) -->
  <!-- Top horizontal: System -> Gemini -->
  <line x1="1044" y1="674" x2="1446" y2="674" stroke="#2563eb" stroke-width="1.9" marker-end="url(#arrowAccent)" />
  <text x="1248" y="660" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">
    Historical Sales &amp; Forecast Request
  </text>

  <!-- Bottom horizontal: Gemini -> System -->
  <line x1="1450" y1="712" x2="1014" y2="712" stroke="#2563eb" stroke-width="1.9" marker-end="url(#arrowAccent)" />
  <text x="1235" y="734" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">
    Demand Forecast Results
  </text>

  <!-- F. Admin / Owner <-> System (UPDATED) -->
  <!-- Left vertical: Admin / Owner -> System -->
  <line x1="835" y1="968" x2="835" y2="742" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="818" y="778" text-anchor="end" font-size="13.5" font-weight="600" fill="#18181b">
    <tspan x="818" dy="0">Login Credentials &amp; User / RBAC Permissions</tspan>
    <tspan x="818" dy="19">Products, Cup Sizes, Add-Ons &amp; Recipes</tspan>
    <tspan x="818" dy="19">Raw Materials, Unit Conversions &amp; Archive / Restore</tspan>
    <tspan x="818" dy="19">Suppliers, PO Creation, Proposal Review &amp; Stock Receiving</tspan>
    <tspan x="818" dy="19">CMS Branding, Hero, Promos &amp; Store Info Updates</tspan>
    <tspan x="818" dy="19">Report, Receipt Journal &amp; Forecast Requests</tspan>
  </text>

  <!-- Right vertical: System -> Admin / Owner -->
  <line x1="965" y1="738" x2="965" y2="964" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="982" y="778" text-anchor="start" font-size="13.5" font-weight="600" fill="#18181b">
    <tspan x="982" dy="0">Dashboard KPIs &amp; Real-Time Alerts (Stock, PO, Prices)</tspan>
    <tspan x="982" dy="19">Demand &amp; Restock Forecasts</tspan>
    <tspan x="982" dy="19">Reports (Sales, Inventory, Movement, Wastage — CSV / Print)</tspan>
    <tspan x="982" dy="19">Sales Receipt Journal &amp; Audit Logs</tspan>
    <tspan x="982" dy="19">Owner-Only Transaction Logs</tspan>
    <tspan x="982" dy="19">Staff Activity &amp; Session Status</tspan>
  </text>

  <!-- Legend -->
  <rect x="64" y="968" width="380" height="84" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.2" />
  <text x="84" y="994" font-size="12.5" font-weight="700" fill="#18181b" letter-spacing="0.4">DIAGRAM LEGEND</text>
  <line x1="84" y1="1014" x2="128" y2="1014" stroke="#18181b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="140" y="1018" font-size="12.5" font-weight="500" fill="#3f3f46">Core / Updated Operational Data Flow</text>
  <line x1="84" y1="1036" x2="128" y2="1036" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowAccent)" />
  <text x="140" y="1040" font-size="12.5" font-weight="500" fill="#1e40af">New External Integration / Public CMS Flow</text>
</svg>
