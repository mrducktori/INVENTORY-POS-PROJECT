<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 1280" width="1860" height="1280" style="font-family: 'Segoe UI', Arial, Helvetica, sans-serif; background: #ffffff;">
  <defs>
