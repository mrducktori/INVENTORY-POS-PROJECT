  <text x="930" y="62" text-anchor="middle" font-size="25" font-weight="800" fill="#18181b">ADMIN &amp; OWNER (+ CUSTOM ROLES) FLOWCHART</text>
  <text x="930" y="88" text-anchor="middle" font-size="14.5" font-weight="600" fill="#52525b">Cof/Tea Cafe — Full Operations, Purchasing, Forecasting, Reports, RBAC &amp; Website CMS</text>
  <line x1="60" y1="106" x2="1800" y2="106" stroke="#e4e4e7" stroke-width="1.2" />

  <!-- Top Flow -->
