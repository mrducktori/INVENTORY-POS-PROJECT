<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1320" width="1560" height="1320" style="font-family: 'Segoe UI', Arial, Helvetica, sans-serif; background: #ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8.5" markerHeight="8.5" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#18181b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="1320" fill="#ffffff" />
  <rect x="24" y="20" width="1512" height="1280" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5" />

  <!-- Title -->
  <text x="780" y="62" text-anchor="middle" font-size="25" font-weight="800" fill="#18181b">STAFF (CASHIER / BARISTA) FLOWCHART</text>
  <text x="780" y="88" text-anchor="middle" font-size="14.5" font-weight="600" fill="#52525b">Cof/Tea Cafe — Login, POS Order Processing, Stock Monitoring &amp; Wastage Reporting</text>
  <line x1="60" y1="106" x2="1500" y2="106" stroke="#e4e4e7" stroke-width="1.2" />

  <!-- Connectors -->
  <line x1="780" y1="176" x2="780" y2="206" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="780" y1="268" x2="780" y2="296" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Login Failed -> Loop back -->
  <polyline points="905,346 1060,346" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="945" y="334" width="32" height="18" rx="4" fill="#ffffff" />
  <text x="961" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">No</text>
  <polyline points="1220,316 1220,238 978,238" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Login Success -> Open Sales Console -->
  <line x1="780" y1="396" x2="780" y2="428" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="788" y="402" width="34" height="18" rx="4" fill="#ffffff" />
  <text x="805" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Yes</text>

  <!-- Console -> Task Decision -->
  <line x1="780" y1="484" x2="780" y2="514" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 3 Task Branches -->
  <!-- Branch 1: Left (POS) -->
  <polyline points="650,564 310,564 310,618" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="380" y="552" width="160" height="18" rx="4" fill="#ffffff" />
  <text x="460" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">Process POS Order</text>

  <!-- Branch 2: Center (Check Stock) -->
  <line x1="780" y1="614" x2="780" y2="660" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="790" y="624" width="120" height="18" rx="4" fill="#ffffff" />
  <text x="850" y="637" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">Monitor Stock</text>

  <!-- Branch 3: Right (Wastage) -->
  <polyline points="910,564 1250,564 1250,618" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1030" y="552" width="130" height="18" rx="4" fill="#ffffff" />
  <text x="1095" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">Report Wastage</text>

  <!-- POS Branch vertical connectors -->
  <line x1="310" y1="680" x2="310" y2="710" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="310" y1="770" x2="310" y2="800" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="310" y1="886" x2="310" y2="922" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="318" y="894" width="52" height="18" rx="4" fill="#ffffff" />
  <text x="344" y="907" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Pay</text>

  <!-- POS Cancel / Edit side branch -->
  <polyline points="425,843 556,843 556,896" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="448" y="831" width="68" height="18" rx="4" fill="#ffffff" />
  <text x="482" y="844" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Edit/Cancel</text>
  <polyline points="556,952 556,1124 686,1124" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#arrow)" />

  <line x1="310" y1="984" x2="310" y2="1014" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="310" y1="1076" x2="310" y2="1124" stroke="#18181b" stroke-width="1.8" />
  <line x1="310" y1="1124" x2="686" y2="1124" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Stock Branch vertical connectors -->
  <line x1="780" y1="726" x2="780" y2="764" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="780" y1="830" x2="780" y2="1090" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Wastage Branch vertical connectors -->
  <line x1="1250" y1="680" x2="1250" y2="714" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1250" y1="776" x2="1250" y2="810" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="1250,872 1250,1124 874,1124" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- End / Sign Out -->
  <line x1="780" y1="1154" x2="780" y2="1182" stroke="#18181b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- SHAPES -->
  <!-- Start -->
  <rect x="700" y="126" width="160" height="50" rx="25" fill="#18181b" />
  <text x="780" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">START</text>

  <!-- Input Login -->
  <polygon points="605,210 980,210 955,268 580,268" fill="#ffffff" stroke="#18181b" stroke-width="2" />
  <text x="780" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Enter Username &amp; Password</text>
  <text x="780" y="254" text-anchor="middle" font-size="11.5" fill="#52525b">Staff Login Page (/coftealoginpageforstaff)</text>

  <!-- Decision: Valid? -->
  <polygon points="780,300 905,348 780,396 655,348" fill="#fffbeb" stroke="#18181b" stroke-width="2" />
  <text x="780" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Valid &amp;</text>
  <text x="780" y="361" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Active?</text>

  <!-- Error / Lockout -->
  <rect x="1064" y="316" width="312" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" />
  <text x="1220" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Display Error / Lockout</text>
  <text x="1220" y="360" text-anchor="middle" font-size="11.5" fill="#991b1b">5-min lock after 3 failed attempts</text>

  <!-- Open Sales Console -->
  <rect x="600" y="432" width="360" height="52" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="780" y="455" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Open Staff Dashboard (Sales Console)</text>
  <text x="780" y="473" text-anchor="middle" font-size="11.5" fill="#52525b">Loads allowed pages &amp; live alert bell</text>

  <!-- Decision: Select Task -->
  <polygon points="780,518 910,566 780,614 650,566" fill="#fffbeb" stroke="#18181b" stroke-width="2" />
  <text x="780" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Select Staff</text>
  <text x="780" y="579" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Operation</text>

  <!-- Branch A: POS -->
  <rect x="130" y="622" width="360" height="58" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="310" y="647" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Select Product, Cup Size &amp; Add-Ons</text>
  <text x="310" y="665" text-anchor="middle" font-size="11.5" fill="#52525b">Search products or filter by category</text>

  <rect x="130" y="714" width="360" height="56" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="310" y="739" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Add to Cart &amp; Click Create Order</text>
  <text x="310" y="757" text-anchor="middle" font-size="11.5" fill="#52525b">Moves order to Ongoing Orders queue</text>

  <polygon points="310,802 425,843 310,884 195,843" fill="#fffbeb" stroke="#18181b" stroke-width="2" />
  <text x="310" y="840" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Checkout</text>
  <text x="310" y="856" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">or Modify?</text>

  <rect x="490" y="900" width="132" height="52" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="1.8" />
  <text x="556" y="923" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">Edit Items or</text>
  <text x="556" y="940" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">Cancel Order</text>

  <polygon points="155,926 485,926 465,984 135,984" fill="#ffffff" stroke="#18181b" stroke-width="2" />
  <text x="310" y="951" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Apply Discount &amp; Cash / GCash</text>
  <text x="310" y="969" text-anchor="middle" font-size="11" fill="#52525b">Senior/PWD/Student/Staff • Enter Ref #</text>

  <rect x="130" y="1018" width="360" height="58" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="310" y="1043" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Complete Sale &amp; Print Receipt</text>
  <text x="310" y="1061" text-anchor="middle" font-size="11.5" fill="#52525b">Auto-deducts recipe &amp; product stock</text>

  <!-- Branch B: Stock -->
  <rect x="610" y="664" width="340" height="62" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="780" y="690" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Open Stock Trackers / Bell Inbox</text>
  <text x="780" y="709" text-anchor="middle" font-size="11.5" fill="#52525b">Raw Material Stock &amp; Product Stock</text>

  <polygon points="625,768 955,768 935,830 605,830" fill="#ffffff" stroke="#18181b" stroke-width="2" />
  <text x="780" y="795" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">View Real-Time Stock Alerts</text>
  <text x="780" y="813" text-anchor="middle" font-size="11" fill="#52525b">Live Out-of-Stock / Low Stock status</text>

  <!-- Branch C: Wastage -->
  <polygon points="1095,622 1425,622 1405,680 1075,680" fill="#ffffff" stroke="#18181b" stroke-width="2" />
  <text x="1250" y="647" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Select Ingredient, Qty &amp; Reason</text>
  <text x="1250" y="665" text-anchor="middle" font-size="11" fill="#52525b">Expiry, Spoilage, Damage, Spillage, etc.</text>

  <rect x="1080" y="718" width="340" height="58" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="1250" y="743" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Submit Wastage Report</text>
  <text x="1250" y="761" text-anchor="middle" font-size="11.5" fill="#52525b">Validates available stock &amp; deducts qty</text>

  <rect x="1080" y="814" width="340" height="58" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="1250" y="839" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">View Logged Wastage History</text>
  <text x="1250" y="857" text-anchor="middle" font-size="11.5" fill="#52525b">Synced to inventory &amp; audit trail</text>

  <!-- Logout / End -->
  <rect x="610" y="1094" width="340" height="60" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="2" />
  <text x="780" y="1120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181b">Sign Out / Auto-Logout</text>
  <text x="780" y="1138" text-anchor="middle" font-size="11.5" fill="#52525b">2-hour inactivity timeout or account deactivation</text>

  <rect x="700" y="1186" width="160" height="50" rx="25" fill="#18181b" />
  <text x="780" y="1217" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">END</text>
</svg>
