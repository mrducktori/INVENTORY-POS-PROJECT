<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" style="font-family: 'Segoe UI', Arial, sans-serif; background: #ffffff;">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#27272a" />
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="40" y="30" width="820" height="1020" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="2" />

  <!-- Header -->
  <text x="450" y="78" text-anchor="middle" font-size="22" font-weight="800" fill="#18181b">
    CofTea Cafe — Supplier Order Flowchart
  </text>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="500" fill="#52525b">
    Simple summary of how suppliers receive, respond to, and fulfill purchase orders
  </text>
  <line x1="80" y1="125" x2="820" y2="125" stroke="#e4e4e7" stroke-width="1.5" />

  <!-- STEP 1: START -->
  
    <g>
      <rect x="350" y="146" width="200" height="38" rx="19" fill="#18181b" stroke="#18181b" stroke-width="2" />
      <text x="450" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Start: Supplier Login</text>
    </g>

  <!-- STEP 2: VIEW ORDERS -->
  
    <g>
      <rect x="300" y="221" width="300" height="48" rx="8" fill="#ffffff" stroke="#27272a" stroke-width="1.8" />
      <text x="450" y="241" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">View Assigned Purchase Orders</text>
      <text x="450" y="259" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">(Incoming order notifications)</text>
    </g>

  <!-- STEP 3: REVIEW ITEMS -->
  
    <g>
      <rect x="300" y="311" width="300" height="48" rx="8" fill="#ffffff" stroke="#27272a" stroke-width="1.8" />
      <text x="450" y="331" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">Inspect Order Details</text>
      <text x="450" y="349" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">(Ingredients, quantities, &amp; delivery date)</text>
    </g>

  <!-- STEP 4: DECISION -->
  
    <g>
      <polygon points="450,407.5 570,445 450,482.5 330,445" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
      <text x="450" y="449.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">Can You Fulfill Order?</text>
    </g>

  <!-- BRANCH A: ACCEPT (Left) -->
  
    <g>
      <rect x="110" y="534" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
      <text x="200" y="556" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Accept Order</text>
      <text x="200" y="574" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">(Status: 'To Be Delivered')</text>
    </g>

  <!-- BRANCH B: PROPOSE / POSTPONE (Center) -->
  
    <g>
      <rect x="350" y="534" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
      <text x="450" y="556" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">Propose New Date</text>
      <text x="450" y="574" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">or Partial Quantities</text>
    </g>
  
    <g>
      <rect x="350" y="631" width="200" height="48" rx="8" fill="#f4f4f5" stroke="#27272a" stroke-width="1.8" />
      <text x="450" y="651" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">Cafe Admin Approves</text>
      <text x="450" y="669" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">Proposed Changes</text>
    </g>

  <!-- BRANCH C: DECLINE (Right) -->
  
    <g>
      <rect x="610" y="534" width="180" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" />
      <text x="700" y="556" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991b1b">Decline Order</text>
      <text x="700" y="574" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991b1b">(Provide reason)</text>
    </g>
  
    <g>
      <rect x="620" y="637" width="160" height="36" rx="18" fill="#991b1b" stroke="#18181b" stroke-width="2" />
      <text x="700" y="660" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Order Closed</text>
    </g>

  <!-- STEP 5: DELIVER GOODS -->
  
    <g>
      <rect x="280" y="730" width="340" height="50" rx="8" fill="#ffffff" stroke="#27272a" stroke-width="1.8" />
      <text x="450" y="751" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">Transport &amp; Deliver Goods</text>
      <text x="450" y="769" text-anchor="middle" font-size="13.5" font-weight="600" fill="#18181b">to CofTea Cafe</text>
    </g>

  <!-- STEP 6: CAFE RECEIVES & CONVERTS STOCK -->
  
    <g>
      <rect x="270" y="827" width="360" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
      <text x="450" y="842" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Cafe Staff Receives Stock</text>
      <text x="450" y="860" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Unit Conversion Applied (e.g., Bags → Grams)</text>
      <text x="450" y="878" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Inventory automatically incremented</text>
    </g>

  <!-- STEP 7: COMPLETE -->
  
    <g>
      <rect x="330" y="935" width="240" height="40" rx="20" fill="#15803d" stroke="#18181b" stroke-width="2" />
      <text x="450" y="960" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Complete: PO Received</text>
    </g>

  <!-- ARROWS -->
  <!-- Top sequence -->
  
    <g>
      <path d="M 450 184 L 450 221" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>
  
    <g>
      <path d="M 450 269 L 450 311" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>
  
    <g>
      <path d="M 450 359 L 450 408" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>

  <!-- Diamond branches -->
  
    <g>
      <path d="M 330 445 L 200 445 L 200 534" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      <rect x="210" y="426" width="90" height="18" rx="4" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
       <text x="255" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#27272a">Yes (Accept)</text>
    </g>
  
    <g>
      <path d="M 450 482 L 450 534" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      <rect x="442.5" y="501" width="105" height="18" rx="4" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
       <text x="495" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#27272a">Partial / Date</text>
    </g>
  
    <g>
      <path d="M 570 445 L 700 445 L 700 534" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      <rect x="600" y="426" width="90" height="18" rx="4" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
       <text x="645" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#27272a">No (Decline)</text>
    </g>

  <!-- Decline path -->
  
    <g>
      <path d="M 700 586 L 700 637" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>

  <!-- Propose approval path -->
  
    <g>
      <path d="M 450 586 L 450 631" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>

  <!-- Clean downward flow into deliver goods -->
  
    <g>
      <path d="M 200 586 L 200 755 L 280 755" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>
  
    <g>
      <path d="M 450 679 L 450 730" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>

  <!-- Final receiving flow -->
  
    <g>
      <path d="M 450 780 L 450 827" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>
  
    <g>
      <path d="M 450 883 L 450 935" fill="none" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrowhead)" />
      
    </g>
</svg>